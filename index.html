<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10b981">
  <meta name="description" content="5-Minuten Fokus Tracker für Christoph">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="5-Min Fokus">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%2310b981' width='192' height='192'/><text x='50%' y='50%' font-size='100' font-weight='bold' text-anchor='middle' dominant-baseline='middle' fill='white'>⚡</text></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%2310b981' width='180' height='180'/><text x='50%' y='50%' font-size='90' font-weight='bold' text-anchor='middle' dominant-baseline='middle' fill='white'>⚡</text></svg>">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
  <title>5-Minuten Fokus – Christoph</title>
</head>
<body>

  <div class="container">
    <!-- Motivierender Header -->
    <div class="header-badge">⚡ TÄGLICHER IMPULS</div>
    <h1>Hi Christoph! 👋</h1>
    
    <div class="quote-box">
      <p class="quote-text">„Die ersten 5 Minuten sind die schwersten. Einfach anfangen und den Haken abholen."</p>
    </div>

    <div class="timer-display" id="timer">05:00</div>
    <button class="btn" id="startBtn">5 Minuten Starten</button>

    <div class="success-count">
      <span>Erfolgreiche Tage in den letzten 15 Tagen:</span>
      <span class="success-count-number" id="successCount">0</span>
    </div>

    <div class="history-section">
      <div class="history-title">Deine Bilanz (Letzte 15 Tage)</div>
      <div class="history-grid" id="historyGrid"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
